[project]
name = "atompad"
version = "0.1.0"
description = "Control the PreSonus ATOM pad controller: RGB pad LEDs, per-pad pressure, knobs, buttons"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Greg Sadetsky" },
]
readme = "README.md"
keywords = ["presonus", "atom", "midi", "controller", "pads", "rgb", "music"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: System :: Hardware",
]
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.urls]
Homepage = "https://github.com/gregsadetsky/atompad"
Repository = "https://github.com/gregsadetsky/atompad"
Issues = "https://github.com/gregsadetsky/atompad/issues"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["atompad"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.mypy.overrides]]
module = "mido.*"
ignore_missing_imports = true
